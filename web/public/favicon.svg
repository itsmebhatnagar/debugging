<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7963A"/>
      <stop offset="100%" stop-color="#6B4B13"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C8"/>
      <stop offset="100%" stop-color="#E8BA5A"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <circle cx="32" cy="32" r="30" fill="#120A05" stroke="url(#goldDark)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Decorative Inner Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Diagonal Minor Spikes -->
  <path d="M16 16 L29 27 L32 32 L27 29 Z" fill="url(#goldDark)"/>
  <path d="M48 16 L35 27 L32 32 L37 29 Z" fill="url(#goldLight)"/>
  <path d="M48 48 L35 37 L32 32 L37 35 Z" fill="url(#goldDark)"/>
  <path d="M16 48 L29 37 L32 32 L27 35 Z" fill="url(#goldLight)"/>

  <!-- Main Compass Spikes -->
  <!-- North -->
  <path d="M32 6 L38 27 L32 32 Z" fill="url(#goldLight)"/>
  <path d="M32 6 L26 27 L32 32 Z" fill="url(#goldDark)"/>
  
  <!-- South -->
  <path d="M32 58 L38 37 L32 32 Z" fill="url(#goldDark)"/>
  <path d="M32 58 L26 37 L32 32 Z" fill="url(#goldLight)"/>
  
  <!-- East -->
  <path d="M58 32 L37 26 L32 32 Z" fill="url(#goldLight)"/>
  <path d="M58 32 L37 38 L32 32 Z" fill="url(#goldDark)"/>
  
  <!-- West -->
  <path d="M6 32 L27 26 L32 32 Z" fill="url(#goldDark)"/>
  <path d="M6 32 L27 38 L32 32 Z" fill="url(#goldLight)"/>

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="5" fill="#120A05" stroke="url(#goldLight)" stroke-width="2"/>
  <circle cx="32" cy="32" r="2" fill="url(#goldLight)"/>
</svg>
